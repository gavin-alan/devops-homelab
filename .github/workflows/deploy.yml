name: Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        run: |
          docker build --no-cache -t ${{ secrets.ECR_REGISTRY }}/devops-homelab:latest ./app
          docker push ${{ secrets.ECR_REGISTRY }}/devops-homelab:latest

  deploy-app:
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy app to ECS
        run: |
          aws ecs update-service \
            --cluster devops-homelab-cluster \
            --service devops-homelab-service \
            --force-new-deployment \
            --region us-east-1

  deploy-monitoring:
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy monitoring stack via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > ssm-params.json <<'EOF'
          {
            "commands": [
              "sudo -u ec2-user -H git -C /home/ec2-user/devops-homelab pull origin main",
              "cd /home/ec2-user/devops-homelab",
              "export GRAFANA_PASSWORD=$(aws ssm get-parameter --name /devops-homelab/grafana-password --with-decryption --query Parameter.Value --output text --region us-east-1)",
              "/usr/local/bin/docker-compose down",
              "/usr/local/bin/docker-compose up -d"
            ]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-params.json \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          sleep 5
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region us-east-1

      - name: Show SSM command output
        if: always()
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -z "$COMMAND_ID" ]; then
            echo "No SSM command was sent."
            exit 0
          fi
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region us-east-1 \
            --output json)
          echo "Status: $(jq -r .Status <<< "$RESULT")"
          echo "--- StandardOutputContent ---"
          jq -r .StandardOutputContent <<< "$RESULT"
          echo "--- StandardErrorContent ---"
          jq -r .StandardErrorContent <<< "$RESULT"
