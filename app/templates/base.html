<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gavin Alan - DevOps Home Lab{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e4e6eb;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #161922;
            border-bottom: 1px solid #2a2d3a;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 2px solid #3b82f6;
        }

        .header-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .header-title {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #3b82f6;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
            font-size: 0.85rem;
        }

        footer a {
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="/static/images/headshot.webp" alt="Gavin Alan" class="avatar">
            <div>
                <div class="header-name">Gavin Alan</div>
                <div class="header-title">Senior Systems Engineer</div>
            </div>
        </div>
        <nav>
            <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
            <a href="/chat" class="{% block nav_chat %}{% endblock %}">Ask AI</a>
            <a href="/docs" target="_blank">API Docs</a>
            <a href="https://github.com/gavin-alan/devops-homelab" target="_blank">GitHub</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Built by Gavin Alan &middot; <a href="https://github.com/gavin-alan/devops-homelab" target="_blank">View source on GitHub</a>
    </footer>
</body>
</html>
