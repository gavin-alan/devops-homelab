---
- name: Configure webserver
  hosts: webservers
  become: yes

  tasks:
    - name: Update all packages
      yum:
        name: "*"
        state: latest

    - name: Install Docker
      yum:
        name: docker
        state: present

    - name: Install Git
      yum:
        name: git
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present

    - name: Set SSH idle timeout to 5 minutes
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^ClientAliveInterval'
        line: 'ClientAliveInterval 300'
        state: present

    - name: Restart SSH to apply hardening changes
      service:
        name: sshd
        state: restarted

    - name: Install firewalld
      yum:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      service:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow SSH through firewall
      command: firewall-cmd --permanent --add-service=ssh

    - name: Allow HTTP through firewall
      command: firewall-cmd --permanent --add-service=http

    - name: Reload firewalld
      command: firewall-cmd --reload

    - name: Install docker-compose
      get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: "0755"

    - name: Clone devops-homelab repo
      git:
        repo: https://github.com/gavin-alan/devops-homelab.git
        dest: /home/ec2-user/devops-homelab
        version: main
      become_user: ec2-user

    - name: Create and enable swap file
      shell: |
        set -e
        if [ ! -f /swapfile ]; then
          dd if=/dev/zero of=/swapfile bs=1M count=1024
          chmod 600 /swapfile
          mkswap /swapfile
        fi
        swapon --show=NAME --noheadings | grep -qx /swapfile || swapon /swapfile
      args:
        executable: /bin/bash

    - name: Persist swap file in fstab
      lineinfile:
        path: /etc/fstab
        line: "/swapfile swap swap defaults 0 0"
        state: present

    # Restart Docker to recreate its firewall rules after the firewalld reload
    - name: Restart Docker
      service:
        name: docker
        state: restarted
